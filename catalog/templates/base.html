<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Do'kon{% endblock %} · Turbo Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #0f6e6e;
    --brand-dark: #0b5555;
    --brand-soft: #e6f2f2;
    --ink: #1b2a34;
    --muted: #6b7785;
    --line: #e3e8ec;
    --bg: #f5f7f8;
    --card: #ffffff;
    --danger: #b3261e;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px; line-height: 1.55; background: var(--bg); color: var(--ink);
  }
  a { color: var(--brand); }
  h1, h2, h3 { letter-spacing: -0.3px; line-height: 1.25; }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 1160px; margin: 0 auto; padding: 0 20px; height: 64px;
    display: flex; align-items: center; gap: 28px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px; text-decoration: none;
    color: var(--ink); font-weight: 800; font-size: 19px; white-space: nowrap;
  }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: #fff;
    display: grid; place-items: center; font-size: 17px; font-weight: 800;
  }
  #nav { display: flex; align-items: center; gap: 4px; flex: 1; }
  #nav a {
    position: relative; color: var(--muted); text-decoration: none; font-weight: 600;
    padding: 8px 12px; border-radius: 8px; transition: color .15s, background .15s;
  }
  #nav a:hover { color: var(--ink); background: var(--bg); }
  #nav a.active { color: var(--brand); background: var(--brand-soft); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .badge {
    display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px;
    margin-left: 4px; border-radius: 10px; background: var(--brand); color: #fff;
    font-size: 12px; font-weight: 700;
  }
  .badge:empty { display: none; }
  .user-chip {
    display: flex; align-items: center; gap: 8px; color: var(--ink) !important;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
    display: grid; place-items: center; font-weight: 800; font-size: 13px;
  }
  .menu-toggle {
    display: none; margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--ink); width: 40px; height: 40px; padding: 0; border-radius: 8px; font-size: 20px;
  }

  @media (max-width: 860px) {
    .menu-toggle { display: grid; place-items: center; }
    #nav {
      display: none; position: absolute; top: 64px; left: 0; right: 0;
      flex-direction: column; align-items: stretch; gap: 2px;
      background: #fff; border-bottom: 1px solid var(--line); padding: 10px 16px 16px;
      box-shadow: 0 12px 24px rgba(27, 42, 52, .08);
    }
    #nav.open { display: flex; }
    .nav-right { margin-left: 0; flex-direction: column; align-items: stretch; gap: 2px;
      border-top: 1px solid var(--line); padding-top: 8px; margin-top: 6px; }
  }

  /* ---------- Layout ---------- */
  .wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding: 28px 20px 48px; flex: 1; }

  /* ---------- Components ---------- */
  .box {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }

  input, select, textarea {
    width: 100%; padding: 10px 12px; margin: 6px 0 12px; font: inherit; color: var(--ink);
    background: #fff; border: 1px solid #d4dce2; border-radius: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 110, 110, .15);
  }

  button, .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--brand); color: #fff; border: 0; padding: 10px 18px;
    border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
    text-decoration: none; transition: background .15s, transform .05s;
  }
  button:hover, .btn:hover { background: var(--brand-dark); }
  button:active, .btn:active { transform: translateY(1px); }
  button:focus-visible, .btn:focus-visible, a:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }
  .red { background: var(--danger); }
  .red:hover { background: #8f1e18; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; }
  th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; background: #fafbfc; }
  tr:last-child td { border-bottom: 0; }

  .err { color: var(--danger); white-space: pre-line; font-size: 14px; }
  img { max-width: 100%; border-radius: 8px; }

  /* ---------- Toast ---------- */
  #toasts { position: fixed; right: 20px; bottom: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    min-width: 240px; max-width: 360px; padding: 12px 16px; border-radius: 10px;
    background: var(--ink); color: #fff; font-weight: 500; font-size: 14px;
    box-shadow: 0 10px 30px rgba(27, 42, 52, .25); white-space: pre-line;
    animation: toast-in .25s ease-out;
  }
  .toast.error { background: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }

  /* ---------- Footer ---------- */
  .site-footer { border-top: 1px solid var(--line); background: #fff; }
  .footer-inner {
    max-width: 1160px; margin: 0 auto; padding: 22px 20px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    color: var(--muted); font-size: 14px;
  }
  .footer-inner a { color: var(--muted); text-decoration: none; }
  .footer-inner a:hover { color: var(--brand); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="/"><span class="logo-mark">T</span>Turbo Shop</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Menyu">☰</button>
    <nav id="nav"></nav>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>© 2026 Turbo Shop</span>
    <span><a href="/api/docs/">API hujjatlari</a></span>
  </div>
</footer>

<div id="toasts" aria-live="polite"></div>

<script>
const token = localStorage.getItem('token');

// API'ga so'rov yuborish (token avtomatik qo'shiladi)
async function api(method, url, body, auth = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && token) headers['Authorization'] = 'Token ' + token;
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined, credentials: 'omit' });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && auth && token) {
    localStorage.removeItem('token');
    location.href = '/login/';
  }
  return { ok: res.ok, status: res.status, data };
}

function needLogin() { if (!token) location.href = '/login/'; }
function list(d) { return Array.isArray(d) ? d : (d && d.results) || []; }
function err(d) { return d ? Object.entries(d).map(([k, v]) => k + ': ' + v).join('\n') : 'Xato'; }
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// Ekran burchagida qisqa xabar
function toast(message, isError = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = message;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// Menyudagi savat soni
async function updateCartCount() {
  const badge = document.getElementById('cartBadge');
  if (!badge || !token) return;
  const r = await api('GET', '/api/cart/');
  if (r.ok && r.data) {
    const n = r.data.items.reduce((s, i) => s + i.quantity, 0);
    badge.textContent = n || '';
  }
}

async function addCart(id, qty = 1) {
  if (!token) return location.href = '/login/';
  const r = await api('POST', '/api/cart/add/', { product_id: id, quantity: qty });
  if (r.ok) { toast("Savatga qo'shildi"); updateCartCount(); }
  else toast(err(r.data), true);
}

function logout() {
  localStorage.removeItem('token');
  location.href = '/';
}

// ---------- Menyu ----------
const nav = document.getElementById('nav');

nav.innerHTML = token
  ? `<a href="/">Mahsulotlar</a>
     <a href="/orders/">Buyurtmalar</a>
     <a href="/likes/">Yoqqanlar</a>
     <span id="adminLink"></span>
     <div class="nav-right">
       <a href="/cart/">Savat<span class="badge" id="cartBadge"></span></a>
       <a href="/profile/" class="user-chip" id="userChip"><span class="avatar">?</span><span>Profil</span></a>
       <a href="#" onclick="logout(); return false;">Chiqish</a>
     </div>`
  : `<a href="/">Mahsulotlar</a>
     <div class="nav-right">
       <a href="/login/">Kirish</a>
       <a href="/register/" class="btn">Ro'yxatdan o'tish</a>
     </div>`;

// Joriy sahifani ajratib ko'rsatish
function markActive() {
  const path = location.pathname;
  nav.querySelectorAll('a[href^="/"]').forEach(a => {
    const href = a.getAttribute('href');
    const match = href === '/' ? (path === '/' || path.startsWith('/product')) : path.startsWith(href);
    a.classList.toggle('active', match && !a.classList.contains('btn'));
  });
}
markActive();

// Mobil menyu
document.getElementById('menuToggle').onclick = () => nav.classList.toggle('open');

// Foydalanuvchi ismi, admin havolasi va savat soni
if (token) {
  updateCartCount();
  api('GET', '/api/auth/profile/').then(r => {
    if (!r.ok || !r.data) return;
    const u = r.data;
    document.getElementById('userChip').innerHTML =
      `<span class="avatar">${esc(u.username).charAt(0).toUpperCase()}</span><span>${esc(u.username)}</span>`;
    if (u.is_staff) {
      document.getElementById('adminLink').innerHTML = '<a href="/admin-orders/">Admin</a>';
      markActive();
    }
  });
}

{% block script %}{% endblock %}
</script>
</body>
</html>
